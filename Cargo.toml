[package]
name = "compass"
version = "0.0.0"
edition = "2021"
description = "Durable planning intent for coding agents"
license = "MIT"

[dependencies]
oxc_allocator = "0.141.0"
oxc_ast = "0.141.0"
oxc_codegen = "0.141.0"
oxc_parser = "0.141.0"
oxc_semantic = "0.141.0"
oxc_span = "0.141.0"
oxc_transformer = "0.141.0"
rquickjs = { version = "0.12.1", features = ["loader", "array-buffer"] }

[profile.release]
opt-level = 2
